<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev Stock Trader</title>
<meta name="description" content="Live dashboard for Alan's Jev stock news paper-trading test - fake money only.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2;
  --surface-1: #fcfcfb;
  --surface-2: #f0efec;
  --border: #e3e2de;
  --grid: #e8e7e3;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7a7974;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --seq-track: #cde2fb;
  --seq-fill: #2a78d6;
  --good: #0ca30c;
  --good-text: #006300;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --critical-text: #b42f2f;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.03);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211;
    --surface-1: #1a1a19;
    --surface-2: #232321;
    --border: #2e2e2b;
    --grid: #2a2a28;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --seq-track: #184f95;
    --seq-fill: #5598e7;
    --good-text: #3fcb3f;
    --critical-text: #ef7a7a;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211;
  --surface-1: #1a1a19;
  --surface-2: #232321;
  --border: #2e2e2b;
  --grid: #2a2a28;
  --text-primary: #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted: #8f8e86;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --seq-track: #184f95;
  --seq-fill: #5598e7;
  --good-text: #3fcb3f;
  --critical-text: #ef7a7a;
  --shadow: none;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text-primary);
  font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 20px; }
header.top h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--text-secondary); font-size: 13px; }
.spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 500; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary); white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
.pill.live .dot { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 20%, transparent); }
.pill.stale .dot { background: var(--warning); }
.pill.down .dot { background: var(--critical); }
button.theme { border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
  border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; }

.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.card h2 { font-size: 14px; font-weight: 600; margin: 0; }
.card .head { display: flex; align-items: baseline; gap: 10px; padding: 16px 18px 0; flex-wrap: wrap; }
.card .head .sub { font-size: 12px; }
.card .body { padding: 14px 18px 18px; }

.hero { display: grid; grid-template-columns: minmax(260px, 1.2fr) 3fr; gap: 16px; margin-bottom: 16px; }
.hero-main { padding: 20px 22px; }
.label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
.hero-value { font-size: 48px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; margin: 6px 0 8px; font-variant-numeric: proportional-nums; }
.delta { font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
.delta.up { color: var(--good-text); }
.delta.down { color: var(--critical-text); }
.delta.flat { color: var(--text-secondary); }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.tile { padding: 16px 18px; }
.tile .value { font-size: 22px; font-weight: 600; margin-top: 4px; letter-spacing: -0.01em; }
.tile .note { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

.verdict { display: flex; gap: 12px; align-items: flex-start; padding: 14px 18px; margin-bottom: 16px; }
.verdict .icon { flex: none; width: 22px; height: 22px; }
.verdict .title { font-weight: 600; }
.verdict .text { color: var(--text-secondary); font-size: 13px; }
.progress { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 8px; }
.progress .meter { width: 180px; }
.meter-track { height: 6px; border-radius: 3px; background: var(--seq-track); overflow: hidden; margin-top: 4px; }
.meter-fill { height: 100%; background: var(--seq-fill); border-radius: 3px; }
.meter-caption { font-size: 12px; color: var(--text-secondary); }

.grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 16px; }
.stack { display: grid; gap: 16px; align-content: start; }
.hero > *, .grid-2 > *, .stack > *, .tiles > *, .reads > * { min-width: 0; }
td.nw { white-space: nowrap; }
.more { margin-top: 4px; }

.legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); margin-left: auto; }
.legend .key { display: inline-flex; align-items: center; gap: 6px; }
.legend .swatch { width: 14px; height: 2px; border-radius: 1px; }
.chart-box { position: relative; }
.chart-box svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text { fill: var(--text-muted); font-size: 11px; font-family: inherit; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.refline { stroke: var(--text-muted); stroke-width: 1; opacity: .5; }
.tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); min-width: 170px; display: none; z-index: 2; }
.tip .t { color: var(--text-secondary); margin-bottom: 4px; }
.tip .row { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.tip .row span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
.tip .sw { width: 8px; height: 8px; border-radius: 50%; }
.empty { color: var(--text-secondary); font-size: 13px; padding: 32px 0; text-align: center; }

.reads { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 16px; }
.read { padding: 16px 18px; }
.read .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.read .mkt { font-weight: 600; font-size: 15px; }
.read .px { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.read .when { font-size: 12px; color: var(--text-muted); }
.qa { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; margin-top: 12px; font-size: 13px; align-items: center; }
.qa .q { color: var(--text-secondary); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.chip .conf { font-weight: 400; color: var(--text-secondary); font-size: 12px; }
.mini { display: flex; align-items: center; gap: 8px; }
.mini .meter-track { flex: 1; margin: 0; }
.mini span { font-size: 12px; color: var(--text-secondary); min-width: 36px; text-align: right; }
.action { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-secondary); }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; margin-right: 6px;
  background: var(--surface-2); color: var(--text-primary); letter-spacing: .02em; }
.badge.buy { background: color-mix(in srgb, var(--good) 18%, var(--surface-1)); color: var(--good-text); }
.badge.sell { background: color-mix(in srgb, var(--critical) 16%, var(--surface-1)); color: var(--critical-text); }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--text-secondary); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.dim { color: var(--text-secondary); }
td.reason { color: var(--text-secondary); font-size: 12px; max-width: 360px; min-width: 220px; }
.pos { color: var(--good-text); }
.neg { color: var(--critical-text); }
.scroll { overflow-x: auto; }
.section { margin-bottom: 16px; }
dl.kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--text-secondary); }
dl.kv dd { margin: 0; text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
ul.rules { margin: 6px 0 12px; padding-left: 18px; font-size: 13px; }
ul.rules li { margin: 3px 0; }
.rules-h { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
details summary { cursor: pointer; color: var(--text-secondary); font-size: 12px; margin-top: 10px; }
.events li { font-size: 12px; margin: 4px 0; color: var(--text-secondary); }
.events .lvl { font-weight: 600; margin-right: 6px; }
footer { color: var(--text-muted); font-size: 12px; text-align: center; margin-top: 24px; }
.notice { padding: 40px 24px; text-align: center; }
.notice h2 { font-size: 18px; margin: 0 0 6px; }

@media (max-width: 900px) {
  .hero, .grid-2 { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 520px) {
  .hero-value { font-size: 40px; }
  .tiles { grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile .value { font-size: 18px; }
  .qa { grid-template-columns: 96px 1fr; }
}

/* stock dashboard additions */
a { color: var(--series-1); }
.small { font-size: 12px; }
.dim { color: var(--text-secondary); }
.key { display: inline-flex; align-items: center; gap: 8px; }
.key .swatch { width: 14px; height: 3px; border-radius: 2px; flex: none; }
.tabs { display: inline-flex; gap: 4px; }
.tab { border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary); border-radius: 8px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.tab.on { background: var(--surface-2); color: var(--text-primary); font-weight: 600; }
.jev { display: grid; grid-template-columns: 64px minmax(110px, 1fr); gap: 3px 8px; font-size: 12px; align-items: center; min-width: 190px; }
.jev .q { color: var(--text-secondary); }
ul.hl { margin: 4px 0 0; padding-left: 16px; font-size: 12px; }
ul.hl li { margin: 2px 0; }
.reason { color: var(--text-secondary); font-size: 12px; margin-top: 4px; }
.show-m { display: none; }
@media (max-width: 600px) { .desc, .hide-m { display: none; } .show-m { display: block; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Jev Stock News Trader</h1>
      <div class="sub" id="subtitle">40 large US shares &middot; Jev reads the news &middot; fake money only &middot; <a href="/crypto.html">crypto bot results</a></div>
    </div>
    <div class="spacer"></div>
    <span class="pill" id="market"><span class="dot"></span><span id="market-text">Market</span></span>
    <span class="pill" id="status"><span class="dot"></span><span id="status-text">Loading&hellip;</span></span>
    <button class="theme" id="theme" type="button" aria-label="Switch light or dark">Theme</button>
  </header>
  <main id="app"></main>
  <footer>Paper trading only &mdash; no real money is used and nothing here is investment advice. Times are UK time. The page refreshes itself every minute.</footer>
</div>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const app = $('#app');
  const TZ = 'Europe/London';
  const gbp = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' });
  const gbp0 = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP', maximumFractionDigits: 0 });
  const usd = (v) => '$' + Number(v).toFixed(2);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pct = (v, d = 2) => (v == null || !isFinite(v)) ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d) + '%';
  const signed = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + gbp.format(Math.abs(v));
  const cls = (v) => v > 0 ? 'pos' : v < 0 ? 'neg' : '';
  const fmtTime = (iso, opts = {}) => new Intl.DateTimeFormat('en-GB', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', ...opts }).format(new Date(iso));
  const ago = (iso) => {
    const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
    if (s < 90) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    return Math.round(s / 86400) + ' days ago';
  };
  const SERIES = { A: 'var(--series-1)', B: 'var(--series-2)', C: 'var(--series-3)', H: 'var(--series-4)', S: 'var(--series-5)' };

  const themeBtn = $('#theme');
  const applyTheme = (t) => { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); };
  try { applyTheme(localStorage.getItem('jev-theme')); } catch {}
  themeBtn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem('jev-theme', next); } catch {}
    if (state.snap) render(state.snap);
  });
  const state = { snap: null, tab: 'A' };

  function setStatus(snap) {
    const pill = $('#status'), txt = $('#status-text');
    pill.classList.remove('live', 'stale', 'down');
    if (!snap || !snap.generated_at) { txt.textContent = 'Waiting for first update'; return; }
    const ageMin = (Date.now() - new Date(snap.generated_at)) / 60000;
    if (ageMin <= 35) { pill.classList.add('live'); txt.textContent = 'Updated ' + ago(snap.generated_at); }
    else if (ageMin <= 180) { pill.classList.add('stale'); txt.textContent = 'Late · ' + ago(snap.generated_at); }
    else { pill.classList.add('down'); txt.textContent = 'Not updating · ' + ago(snap.generated_at); }
    const m = snap.market, mp = $('#market'), mt = $('#market-text');
    mp.classList.remove('live', 'stale');
    if (m && m.open) { mp.classList.add('live'); mt.textContent = 'US market open · closes ' + fmtTime(m.next_close, { weekday: undefined, day: undefined, month: undefined }); }
    else if (m) { mt.textContent = 'US market closed · opens ' + fmtTime(m.next_open); }
    else mt.textContent = 'US market';
  }

  const icon = {
    info: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01"/></svg>',
    good: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="var(--good)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>',
    bad: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="var(--critical)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
  };

  function verdictBlock(s) {
    const v = s.verdict || '';
    let kind = 'info', title = 'Too early to judge';
    if (!s.started) title = 'Starting at the next US market open';
    else if (v.startsWith('NOT WORKING')) { kind = 'bad'; title = 'Jev is doing no better than random picks'; }
    else if (v.startsWith('A IS AHEAD')) { kind = 'good'; title = 'Jev is ahead on paper'; }
    else if (v.startsWith('A beats random')) { title = 'Better than random, worse than holding'; }
    const body = v.replace(/^[A-Z][A-Z \-']+\.\s*/, '');
    const A = s.accounts[0], closed = A.closed, days = Math.max(0, s.days || 0);
    return `<div class="card verdict">${icon[kind]}<div style="flex:1">
      <div class="title">${esc(title)}</div><div class="text">${esc(body)}</div>
      ${s.started ? `<div class="progress">
        <div class="meter"><div class="meter-caption">A's closed trades: ${closed} of 30</div><div class="meter-track"><div class="meter-fill" style="width:${Math.min(100, closed / 30 * 100)}%"></div></div></div>
        <div class="meter"><div class="meter-caption">Days tested: ${Math.floor(days)} of 60</div><div class="meter-track"><div class="meter-fill" style="width:${Math.min(100, days / 60 * 100)}%"></div></div></div>
      </div>` : ''}</div></div>`;
  }

  // ---------- the race: five lines, all starting at £10,000 ----------
  function niceStep(range, target) {
    const raw = range / target, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
    return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
  }
  function drawChart(box, s) {
    const rows = s.series.rows, ids = s.series.ids;
    if (!rows || rows.length < 2) { box.innerHTML = '<div class="empty">The chart starts once the US market has opened and the bot has run twice.</div>'; return; }
    const css = getComputedStyle(document.documentElement);
    const col = (id) => css.getPropertyValue(SERIES[id].slice(4, -1)).trim();
    const W = Math.max(300, Math.round(box.clientWidth || 760)), H = W < 500 ? 220 : 280, L = 56, R = 12, T = 12, B = 28;
    const t0 = Date.parse(rows[0][0]), t1 = Date.parse(rows.at(-1)[0]);
    let lo = Infinity, hi = -Infinity;
    rows.forEach(r => ids.forEach((_, i) => { lo = Math.min(lo, r[1 + i]); hi = Math.max(hi, r[1 + i]); }));
    lo = Math.min(lo, s.start_gbp); hi = Math.max(hi, s.start_gbp);
    const pad = Math.max((hi - lo) * 0.08, 20); lo -= pad; hi += pad;
    const x = (t) => L + (W - L - R) * (t1 > t0 ? (t - t0) / (t1 - t0) : 0), y = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
    const step = niceStep(hi - lo, 5);
    let g = '';
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) g += `<line class="gridline" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${gbp0.format(v)}</text>`;
    const days = Math.max(1, (t1 - t0) / 86400000), ticks = Math.min(W < 500 ? 3 : 6, Math.ceil(days) + 1);
    for (let k = 0; k < ticks; k++) { const t = t0 + (t1 - t0) * k / Math.max(1, ticks - 1); g += `<text x="${x(t)}" y="${H - 8}" text-anchor="${k === 0 ? 'start' : k === ticks - 1 ? 'end' : 'middle'}">${new Intl.DateTimeFormat('en-GB', { timeZone: TZ, day: 'numeric', month: 'short' }).format(new Date(t))}</text>`; }
    const paths = ids.map((id, i) => {
      const d = rows.map((r, k) => `${k ? 'L' : 'M'}${x(Date.parse(r[0])).toFixed(1)},${y(r[1 + i]).toFixed(1)}`).join('');
      return `<path d="${d}" fill="none" stroke="${col(id)}" stroke-width="${id === 'A' ? 2.5 : 1.6}" ${id === 'H' || id === 'S' ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round"/>`;
    }).join('');
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Value of each paper account over time"><g class="axis">${g}</g>
      <line class="refline" x1="${L}" x2="${W - R}" y1="${y(s.start_gbp)}" y2="${y(s.start_gbp)}"/>${paths}<line id="hover" stroke="var(--text-muted)" stroke-width="1" y1="${T}" y2="${H - B}" style="display:none"/></svg><div class="tip"></div>`;
    const svg = box.querySelector('svg'), tip = box.querySelector('.tip'), hl = box.querySelector('#hover');
    const names = Object.fromEntries([...s.accounts, ...s.bench].map(a => [a.id, a.name]));
    svg.addEventListener('pointermove', (e) => {
      const rect = svg.getBoundingClientRect(), px = (e.clientX - rect.left) / rect.width * W;
      const t = t0 + (px - L) / (W - L - R) * (t1 - t0);
      let best = rows[0]; for (const r of rows) if (Math.abs(Date.parse(r[0]) - t) < Math.abs(Date.parse(best[0]) - t)) best = r;
      const bx = x(Date.parse(best[0]));
      hl.setAttribute('x1', bx); hl.setAttribute('x2', bx); hl.style.display = '';
      tip.innerHTML = `<div class="t">${fmtTime(best[0])}</div>` + ids.map((id, i) => `<div class="row"><span><span class="sw" style="background:${col(id)}"></span>${esc(names[id] || id)}</span><b>${gbp0.format(best[1 + i])}</b></div>`).join('');
      tip.style.display = 'block';
      const left = bx / W * rect.width; tip.style.left = Math.min(Math.max(0, left + 12), rect.width - 230) + 'px'; tip.style.top = '8px';
    });
    svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; hl.style.display = 'none'; });
  }

  function raceBlock(s) {
    const all = [...s.accounts, ...s.bench];
    const rowsHtml = all.map(a => `<tr>
      <td><span class="key"><span class="swatch" style="background:${SERIES[a.id]}"></span><b>${esc(a.name)}</b></span><div class="dim small desc">${esc(a.desc)}</div></td>
      <td class="num">${gbp.format(a.equity)}</td><td class="num ${cls(a.ret)}">${pct(a.ret)}</td>
      <td class="num hide-m">${a.closed != null ? `${a.closed}${a.closed ? ` <span class="dim">(${a.wins} won)</span>` : ''}` : '—'}</td>
      <td class="num hide-m">${a.holdings ? a.holdings.length : '—'}</td></tr>`).join('');
    const legend = `<details class="show-m"><summary>What each line means</summary><ul class="rules">${all.map(a => `<li><b>${esc(a.name)}</b>: ${esc(a.desc)}</li>`).join('')}</ul></details>`;
    return `<div class="card section"><div class="head"><h2>The race</h2><span class="sub">Each line started with £10,000 of pretend money${s.started ? ' on ' + fmtTime(s.started, { weekday: undefined, hour: undefined, minute: undefined }) : ''}</span></div>
      <div class="body"><div class="chart-box" id="chart"></div>
      <div class="scroll" style="margin-top:12px"><table><thead><tr><th>Account</th><th class="num">Value</th><th class="num">Return</th><th class="num hide-m">Closed trades</th><th class="num hide-m">Holding</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>${legend}</div></div>`;
  }

  function holdingsBlock(s) {
    const tabs = s.accounts.map(a => `<button type="button" class="tab ${state.tab === a.id ? 'on' : ''}" data-tab="${a.id}">${a.id} · ${a.holdings.length}</button>`).join('');
    const a = s.accounts.find(x => x.id === state.tab) || s.accounts[0];
    const hold = a.holdings.length ? `<div class="scroll"><table><thead><tr><th>Share</th><th class="num">Bought at</th><th class="num">Now</th><th class="num">Value</th><th class="num">P&amp;L</th><th class="num">Stop</th><th>Bought</th><th>Why</th></tr></thead><tbody>
      ${a.holdings.map(h => `<tr><td><b>${esc(h.ticker)}</b> <span class="dim">${esc(h.name)}</span></td><td class="num">${usd(h.entry)}</td><td class="num">${usd(h.price)}</td><td class="num">${gbp.format(h.value)}</td>
        <td class="num ${cls(h.pnl)}">${signed(h.pnl)} (${pct(h.pnl_pct, 1)})</td><td class="num dim">${usd(h.stop)}</td><td class="nw dim">${fmtTime(h.since)}</td><td class="reason">${esc(h.why)}</td></tr>`).join('')}</tbody></table></div>`
      : '<div class="empty">Nothing held right now.</div>';
    const tr = a.trades.length ? `<details ${a.trades.length < 6 ? 'open' : ''}><summary>Last ${a.trades.length} trades</summary><div class="scroll"><table><thead><tr><th>When</th><th>Share</th><th></th><th class="num">Price</th><th class="num">£</th><th class="num">P&amp;L</th><th>Why</th></tr></thead><tbody>
      ${a.trades.map(t => `<tr><td class="nw dim">${fmtTime(t.time)}</td><td><b>${esc(t.ticker)}</b></td><td><span class="badge ${t.side === 'BUY' ? 'buy' : 'sell'}">${t.side}</span></td><td class="num">${usd(t.price)}</td><td class="num">${gbp.format(t.gbp)}</td>
        <td class="num ${cls(t.pnl)}">${t.pnl != null ? `${signed(t.pnl)} (${pct(t.pnl_pct, 1)})` : ''}</td><td class="reason">${esc(t.why)}</td></tr>`).join('')}</tbody></table></div></details>` : '';
    return `<div class="card section"><div class="head"><h2>Holdings</h2><div class="tabs">${tabs}</div><span class="sub">Cash ${gbp.format(a.cash)} · fees and costs so far ${gbp.format(a.fees)}</span></div><div class="body">${hold}${tr}</div></div>`;
  }

  const meter = (v) => v == null ? '—' : `<span class="mini"><span class="meter-track"><span class="meter-fill" style="display:block;width:${Math.round(v * 100)}%"></span></span><span>${v.toFixed(2)}</span></span>`;
  function jevCell(e) {
    if (!e.jev) return `<span class="dim">${esc(e.note || '—')}</span>`;
    const j = e.jev;
    const imp = j.impact === 'positive' ? 'pos' : j.impact === 'negative' ? 'neg' : '';
    return `<div class="jev"><span class="q">Material</span>${meter(j.material)}<span class="q">Impact</span><span class="${imp}"><b>${esc(j.impact)}</b> <span class="dim">${(j.impact_conf ?? 0).toFixed(2)}</span></span><span class="q">Priced in</span>${meter(j.priced_in)}</div>`;
  }
  const actionChips = (a) => !a || !Object.keys(a).length ? '<span class="dim">no trades</span>'
    : Object.entries(a).map(([k, v]) => `<span class="badge ${/BUY/.test(v) ? 'buy' : 'sell'}">${k}: ${esc(v)}</span>`).join(' ');
  function newsTitle(e) {
    const link = e.url ? ` <a href="${esc(e.url)}" target="_blank" rel="noopener">filing</a>` : '';
    const hl = e.headlines ? `<ul class="hl">${e.headlines.map(h => `<li><span class="dim">${esc(h.source)}:</span> ${esc(h.title)}</li>`).join('')}</ul>` : '';
    return `<b>${esc(e.ticker)}</b> <span class="badge">${e.kind === 'filing' ? 'SEC filing' : 'headlines'}</span><div>${esc(e.title)}${link}</div>${hl}`;
  }
  function newsBlock(s) {
    const wait = s.waiting.length ? `<div class="scroll"><table><thead><tr><th>Published</th><th>News</th><th>Decided from</th></tr></thead><tbody>
      ${s.waiting.map(e => `<tr><td class="nw dim">${fmtTime(e.time)}</td><td>${newsTitle(e)}</td><td class="nw dim">${e.decide_after ? fmtTime(e.decide_after) : ''}</td></tr>`).join('')}</tbody></table></div>`
      : '<div class="empty">No news waiting.</div>';
    const dec = s.decided.length ? `<div class="scroll"><table><thead><tr><th>Decided</th><th>News</th><th>Jev's read</th><th class="num">Share moved</th><th>Trades</th></tr></thead><tbody>
      ${s.decided.map(e => `<tr><td class="nw dim">${e.decided_at ? fmtTime(e.decided_at) : esc(e.status)}</td><td>${newsTitle(e)}${e.a_why ? `<div class="reason">A: ${esc(e.a_why)}</div>` : ''}</td><td>${jevCell(e)}</td>
        <td class="num">${e.reaction != null ? `<span class="${cls(e.reaction)}">${pct(e.reaction, 1)}</span><div class="dim small">market ${pct(e.market, 1)}</div>` : '—'}</td><td>${actionChips(e.actions)}</td></tr>`).join('')}</tbody></table></div>`
      : '<div class="empty">Nothing decided yet. News is decided 30 minutes into US trading, once the price reaction is known.</div>';
    return `<div class="card section"><div class="head"><h2>Waiting for the market</h2><span class="sub">${s.waiting.length} item${s.waiting.length === 1 ? '' : 's'} · decided 30 min into trading after publication</span></div><div class="body">${wait}</div></div>
      <div class="card section"><div class="head"><h2>Decided news</h2><span class="sub">Latest ${s.decided.length}</span></div><div class="body">${dec}</div></div>`;
  }

  function aboutBlock(s) {
    const r = s.rules, st = s.stats;
    const q = Object.entries(r.questions).map(([k, v]) => `<li><b>${esc(k)}</b> (${esc(v.type === 'noul' ? 'yes/no probability' : v.type)}): ${esc(v.instructions)}</li>`).join('');
    const cost = st.costed ? `$${st.cost.toFixed(4)} over ${st.jev_calls} reads` : `${st.jev_calls} reads`;
    const log = s.log.filter(l => l.level !== 'TRADE').slice(0, 25);
    return `<div class="grid-2">
      <div class="card"><div class="head"><h2>How the test works</h2></div><div class="body">
        <div class="rules-h">What Jev is asked about each piece of news</div><ul class="rules">${q}</ul>
        <div class="rules-h">A buys when</div><ul class="rules"><li>material at least ${r.a.buy.material_at_least}, impact '${r.a.buy.impact}' with confidence at least ${r.a.buy.impact_confidence}, and priced in below ${r.a.buy.priced_in_below}</li></ul>
        <div class="rules-h">A sells a holding when</div><ul class="rules"><li>material at least ${r.a.sell.material_at_least} and impact '${r.a.sell.impact}' with confidence at least ${r.a.sell.impact_confidence}</li></ul>
        <div class="rules-h">Same for every account</div><ul class="rules">
          <li>${r.risk.position_size_pct}% of the account per share, at most ${r.risk.max_positions} holdings and ${r.risk.max_buys_per_day} purchases a day</li>
          <li>Stop-loss ${r.risk.stop_loss_pct}% below the buying price; once ${r.risk.trail_after_gain_pct}% up, the stop follows ${r.risk.stop_loss_pct}% below the highest price</li>
          <li>Sold after ${r.risk.max_hold_days} days at most</li>
          <li>Costs (assumed): ${r.risk.fx_fee_pct}% currency conversion each way plus ${r.risk.slippage_pct}% price slippage. No stamp duty on US shares.</li></ul>
        <div class="rules-h">Shares watched</div><p class="small dim">${r.universe.map(u => esc(u.ticker)).join(', ')}</p>
        <div class="rules-h">Sources</div><p class="small dim">Company filings from the SEC (EDGAR), headlines from Nasdaq and Seeking Alpha, prices from Yahoo Finance (5-minute bars).</p>
      </div></div>
      <div class="stack">
        <div class="card"><div class="head"><h2>Jev usage</h2></div><div class="body"><dl class="kv">
          <dt>News reads</dt><dd>${st.jev_calls}</dd><dt>Average answer time</dt><dd>${st.avg_secs}s</dd><dt>Cost so far</dt><dd>${esc(cost)}</dd>
          <dt>Busy, retried later</dt><dd>${st.jev_busy}</dd><dt>Errors</dt><dd>${st.jev_errors}</dd>
          <dt>SEC filings found</dt><dd>${st.filings}</dd><dt>Headline batches</dt><dd>${st.headline_events}</dd>
          ${s.credits ? `<dt>AI Gateway credit left</dt><dd>$${s.credits.balance.toFixed(2)}</dd>` : ''}
          <dt>£1 =</dt><dd>$${(s.fx || 0).toFixed(4)}</dd></dl></div></div>
        <div class="card"><div class="head"><h2>Recent notes</h2></div><div class="body">${log.length ? `<ul class="events">${log.map(l => `<li><span class="lvl">${esc(l.level)}</span>${esc(fmtTime(l.time))} · ${esc(l.message)}</li>`).join('')}</ul>` : '<div class="dim small">Nothing to report.</div>'}</div></div>
      </div></div>`;
  }

  function render(s) {
    if (!s || s.empty) { app.innerHTML = `<div class="card notice"><h2>Starting up</h2><p class="sub">The stock bot hasn't finished its first round yet. This page will fill in by itself.</p></div>`; return; }
    app.innerHTML = verdictBlock(s) + raceBlock(s) + holdingsBlock(s) + newsBlock(s) + aboutBlock(s);
    drawChart($('#chart'), s);
    app.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { state.tab = b.dataset.tab; render(s); }));
  }

  async function load() {
    try {
      const r = await fetch('/api/data', { cache: 'no-store' });
      const s = await r.json();
      state.snap = s; setStatus(s); render(s);
    } catch (e) {
      if (!state.snap) app.innerHTML = `<div class="card notice"><h2>Couldn't load the data</h2><p class="sub">${esc(e.message)}</p></div>`;
    }
  }
  load();
  setInterval(load, 60000);
  let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => state.snap && !state.snap.empty && drawChart($('#chart'), state.snap), 150); });
  setInterval(() => state.snap && setStatus(state.snap), 20000);
})();
</script>
</body>
</html>
